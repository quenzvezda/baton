name: milestones

# Keeps GitHub milestones in sync with docs/milestones/*.md (scripts/sync-github-milestones.sh).
on:
  push:
    branches: [main]
    paths:
      - docs/milestones/**
      - openspec/changes/**
      - scripts/sync-github-milestones.sh
  workflow_dispatch:

concurrency:
  group: milestones
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # milestones belong to the issues API

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync milestones
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/sync-github-milestones.sh
