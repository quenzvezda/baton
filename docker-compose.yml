# Local development dependencies. Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: baton-postgres
    environment:
      POSTGRES_DB: baton
      POSTGRES_USER: baton
      POSTGRES_PASSWORD: baton   # dev only — never reuse outside localhost
    ports:
      - "5432:5432"
    volumes:
      - baton-pgdata:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baton -d baton"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Development OIDC provider for the console sign-in (ADR-0017). Realm `baton`, users viewer/operator/admin,
  # password = user name — dev only.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: baton-keycloak
    command: start-dev --import-realm --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin   # dev only
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/keycloak/baton-realm.json:/opt/keycloak/data/import/baton-realm.json:ro

volumes:
  baton-pgdata:
