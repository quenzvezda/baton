# Local development dependencies. Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: baton-postgres
    environment:
      POSTGRES_DB: baton
      POSTGRES_USER: baton
      POSTGRES_PASSWORD: baton   # dev only — never reuse outside localhost
    ports:
      - "5432:5432"
    volumes:
      - baton-pgdata:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baton -d baton"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  baton-pgdata:
